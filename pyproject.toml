[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "primostrata-edge"
version = "0.1.0"
description = "Compiled native Rust HTTP/1.1 + PRM1 edge web framework & L4/L7 security SDK for Python"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
fast = ["orjson>=3.10"]
asgi = ["starlette>=0.36", "fastapi>=0.110"]
bench = ["pytest>=8.0", "httpx>=0.27", "cryptography>=42.0", "uvicorn>=0.30", "granian>=2.0", "blacksheep>=2.0", "robyn>=0.70"]

[tool.setuptools.packages.find]
include = ["primostrata_edge*"]

[tool.setuptools.package-data]
primostrata_edge = ["*.dll", "*.so"]
